[package]
name = "btmanage-linux"
description = "btManage for Linux: tray icon and battery panel for wireless earbuds"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "btmanage"
path = "src/main.rs"

[dependencies]
# The core lives in its own repository, checked out next to this one.
btmanage-core = { path = "../btManage-core/crates/btmanage-core" }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
ureq = "3.5.1"
webbrowser = "1.2.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }
