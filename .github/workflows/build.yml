name: Build

# Every push and pull request builds the application and keeps the result as artifacts.
# Pushes to main/master publish a release using the version from Cargo.toml, with a numeric
# suffix when that version has already been used. Pushing a "v1.2.3" tag also publishes a
# release.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Branch, tag or commit of btManage-core to build against (default branch if empty)
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare version
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: btManage-linux

      - name: Choose and reserve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/* ]]; then
            base_version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' btManage-linux/Cargo.toml | head -n 1)"
            if [[ -z "$base_version" ]]; then
              echo "::error::Could not read the base version from Cargo.toml."
              exit 1
            fi

            tags="$(gh api --paginate "repos/$GH_REPO/tags?per_page=100" --jq '.[].name')"
            suffix=0
            while :; do
              if (( suffix == 0 )); then
                version="$base_version"
              else
                version="$base_version.$suffix"
              fi
              tag="v$version"

              if grep -Fqx "$tag" <<< "$tags"; then
                suffix=$((suffix + 1))
                continue
              fi

              if output="$(gh api --method POST "repos/$GH_REPO/git/refs" \
                -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" 2>&1)"; then
                break
              elif [[ "$output" == *"Reference already exists"* ]]; then
                tags+=$'\n'"$tag"
                suffix=$((suffix + 1))
              else
                echo "$output" >&2
                exit 1
              fi
            done
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::Release version '$version' must contain three or four numeric components."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version" >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux ${{ matrix.arch }}
    # btManage-core is private. Pull requests from forks do not get its token, so they are skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest images on offer: the binary then runs on any distribution with glibc 2.35 or newer.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    env:
      HAS_CORE_TOKEN: ${{ secrets.CORE_REPO_TOKEN != '' }}
      # Read at compile time by src/update.rs: what this build is, and where its updates come from.
      BTM_VERSION: ${{ needs.prepare.outputs.version }}
      BTM_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Require the core token
        if: env.HAS_CORE_TOKEN != 'true'
        run: |
          echo "::error::Secret CORE_REPO_TOKEN is not set. Add a fine-grained token with read access to the contents of btManage-core (Settings, Secrets and variables, Actions)."
          exit 1

      # The two repositories sit side by side, as on a developer machine.
      - uses: actions/checkout@v7
        with:
          path: btManage-linux

      - name: Check out the core
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/btManage-core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: btManage-core

      - name: Record the versions
        run: echo "Version $BTM_VERSION, built against btManage-core \`$(git -C btManage-core rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: btManage-linux

      - name: Format
        working-directory: btManage-linux
        run: cargo fmt --check

      - name: Lint
        working-directory: btManage-linux
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: btManage-linux
        run: cargo test --locked

      - name: Build
        working-directory: btManage-linux
        run: cargo build --release --locked

      # The name is part of the contract with the updater: it looks for "linux-<arch>"
      # among the release files.
      - name: Package
        run: |
          mkdir -p dist/btmanage
          cp btManage-linux/target/release/btmanage dist/btmanage/
          cp btManage-linux/assets/btmanage.desktop btManage-linux/LICENSE dist/btmanage/
          tar -C dist -czf btmanage-linux-${{ matrix.arch }}.tar.gz btmanage

      - uses: actions/upload-artifact@v7
        with:
          name: btManage-linux-${{ matrix.arch }}
          path: btmanage-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # The interface also runs on Windows, in demo mode, so it can be looked at without a Linux
  # machine. This keeps that path building. It is not part of a release.
  windows-preview:
    name: Windows preview
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    env:
      HAS_CORE_TOKEN: ${{ secrets.CORE_REPO_TOKEN != '' }}
    steps:
      - name: Require the core token
        if: env.HAS_CORE_TOKEN != 'true'
        shell: bash
        run: |
          echo "::error::Secret CORE_REPO_TOKEN is not set."
          exit 1

      - uses: actions/checkout@v7
        with:
          path: btManage-linux

      - name: Check out the core
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/btManage-core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: btManage-core

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: btManage-linux

      - name: Build
        working-directory: btManage-linux
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: preview-windows
          path: btManage-linux/target/release/btmanage.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    needs: [prepare, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the Linux archives: the Windows preview is a development aid.
      - uses: actions/download-artifact@v8
        with:
          pattern: btManage-linux-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
